<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#004494"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main Agent @ Symbol Badge -->
  <g filter="url(#shadow)">
    <!-- Outer Yellow Ring -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="#FFCC00" stroke-width="36"/>
    <!-- Center Dot -->
    <circle cx="256" cy="256" r="45" fill="#FFFFFF"/>
    <!-- Swash / Tail -->
    <path d="M 330 256 C 330 340 256 370 210 350 C 180 335 170 300 190 280 C 210 260 250 270 270 290 C 280 300 295 305 305 295 C 320 280 310 256 290 240" 
          fill="none" stroke="#FFCC00" stroke-width="32" stroke-linecap="round"/>
  </g>
</svg>
